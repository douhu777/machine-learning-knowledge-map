['topics','pca','包含','PCA用于降维与降噪。'],['topics','cluster','包含','聚类用于发现无标签群组。'],['topics','timeseries','包含','时间序列处理带时间依赖的数据。'],['topics','hmm','包含','HMM用于隐藏状态序列建模。'],['topics','kg','包含','知识图谱组织实体及其关系。'],['unsupervised','pca','方法','PCA是无监督表示方法。'],['unsupervised','cluster','方法','聚类是典型无监督任务。'],['split','timeseries','约束','时间序列评估必须保持时间顺序。'],['hmm','timeseries','关联','HMM是序列概率模型，关注隐状态而非普通数值外推。'],['kg','nn','应用','现代NER与关系抽取常使用神经网络表示。']
].map((e,i)=>({id:'e'+i,a:e[0],b:e[1],label:e[2],detail:e[3]}));
const nodeMap=Object.fromEntries(nodes.map(n=>[n.id,n]));
const svg=document.getElementById('graph'), viewport=document.getElementById('viewport'), edgeLayer=document.getElementById('edges'), nodeLayer=document.getElementById('nodes'), detail=document.getElementById('detail');
function el(tag,attrs,parent){const x=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs||{}))x.setAttribute(k,v);if(parent)parent.appendChild(x);return x}
edges.forEach(e=>{const a=nodeMap[e.a],b=nodeMap[e.b],g=el('g',{class:'edge-group','data-id':e.id,tabindex:'0',role:'button','aria-label':`${a.label}与${b.label}：${e.label}`},edgeLayer);const d=`M${a.x},${a.y} L${b.x},${b.y}`;el('path',{d,class:'edge-visible'},g);el('path',{d,class:'edge-hit'},g);const t=el('text',{x:(a.x+b.x)/2,y:(a.y+b.y)/2-5,class:'edge-label'},g);t.textContent=e.label;g.addEventListener('click',ev=>{ev.stopPropagation();showEdge(e,g)});g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();showEdge(e,g)}})});
nodes.forEach(n=>{const g=el('g',{class:`node ${n.group==='root'?'root':''}`,'data-id':n.id,transform:`translate(${n.x} ${n.y})`,tabindex:'0',role:'button','aria-label':n.label},nodeLayer);const r=n.group==='root'?42:(['base','model','train','topic'].includes(n.group)&&['foundation','problem','data','training','evaluation','models','topics'].includes(n.id)?30:21);el('circle',{r,fill:colors[n.group]},g);const t=el('text',{y:r+22},g);t.textContent=n.label;g.addEventListener('click',ev=>{ev.stopPropagation();showNode(n,g)});g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();showNode(n,g)}})});
function clearActive(){document.querySelectorAll('.active').forEach(x=>x.classList.remove('active'))}
function showNode(n,g){clearActive();g.classList.add('active');const linked=edges.filter(e=>e.a===n.id||e.b===n.id).map(e=>{const other=nodeMap[e.a===n.id?e.b:e.a];return `<li><strong>${e.label}</strong> · ${other.label}</li>`}).join('');const correction=n.id==='biasvariance'?'原文把Bias和Variance简单写成几个误差数值之差，这不是标准定义。':n.id==='scaling'?'原文将标准化描述成变为标准正态分布；通常它只调整均值与标准差。':n.id==='regmetrics'?'原文称R²范围为0–1；测试集R²可能小于0。':n.id==='linear'?'原文称逻辑回归损失为凸函数但“无最优解”，这一表述有误；凸性通常有利于求全局最优。':n.id==='timeseries'?'原文部分ADF检验解释混乱，应依据原假设、统计量、临界值和p值共同判断。':'';detail.innerHTML=`<div class="eyebrow">${n.type}</div><h2>${n.label}</h2><p class="summary">${n.summary}</p><div class="tagrow">${n.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><h3>学习重点</h3><p class="summary">${n.focus}</p>${correction?`<div class="correction"><strong>原文纠错：</strong>${correction}</div>`:''}<h3>直接关系</h3><ul>${linked}</ul>`}
function showEdge(e,g){clearActive();g.classList.add('active');const a=nodeMap[e.a],b=nodeMap[e.b];detail.innerHTML=`<div class="eyebrow">关系 · ${e.label}</div><h2>${a.label} → ${b.label}</h2><div class="relation-box"><strong>为什么相连</strong><p class="summary">${e.detail}</p></div><h3>记忆提示</h3><p class="summary">不要只背两个概念的定义；能用自己的话解释这条连线，才说明知识已经形成网络。</p><div class="tagrow"><span class="tag">${a.type}</span><span class="tag">${b.type}</span></div>`}
let scale=1,tx=0,ty=0,drag=false,last={x:0,y:0};function apply(){viewport.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`)}function zoom(f,cx=600,cy=425){const ns=Math.max(.48,Math.min(2.4,scale*f));tx=cx-(cx-tx)*ns/scale;ty=cy-(cy-ty)*ns/scale;scale=ns;apply()}
svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:.89,e.offsetX*1200/svg.clientWidth,e.offsetY*850/svg.clientHeight)},{passive:false});svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node,.edge-group'))return;drag=true;last={x:e.clientX,y:e.clientY};svg.setPointerCapture(e.pointerId);svg.classList.add('dragging')});svg.addEventListener('pointermove',e=>{if(!drag)return;tx+=(e.clientX-last.x)*1200/svg.clientWidth;ty+=(e.clientY-last.y)*850/svg.clientHeight;last={x:e.clientX,y:e.clientY};apply()});svg.addEventListener('pointerup',()=>{drag=false;svg.classList.remove('dragging')});
document.getElementById('zoomIn').onclick=()=>zoom(1.2);document.getElementById('zoomOut').onclick=()=>zoom(.83);document.getElementById('reset').onclick=()=>{scale=1;tx=0;ty=0;apply();document.getElementById('search').value='';document.querySelectorAll('.dim').forEach(x=>x.classList.remove('dim'))};
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();nodes.forEach(n=>document.querySelector(`.node[data-id="${n.id}"]`).classList.toggle('dim',!!q&&!([n.label,n.summary,...n.tags].join(' ').toLowerCase().includes(q))));edges.forEach(ed=>{const on=!q||[nodeMap[ed.a],nodeMap[ed.b]].some(n=>[n.label,n.summary,...n.tags].join(' ').toLowerCase().includes(q));document.querySelector(`.edge-group[data-id="${ed.id}"]`).classList.toggle('dim',!on)})});
</script>
